const STORAGE='majalis_delivery_preview_cart_v2', FAV_KEY='majalis_delivery_preview_favorites_v1';
const state={checkout:{coords:null,addressText:''},category:'الكل',query:'',sort:'default',quantity:1,note:'',cart:[],favorites:[],fulfillment:'pickup',generalNote:'',customer:{name:'',phone:'',city:'',district:'',street:'',building:'',unit:'',landmark:'',pickupBranch:''},origin:'/',searchMode:false};
const el=id=>document.getElementById(id);
function safeGet(key,fallback){try{const v=JSON.parse(localStorage.getItem(key));return v??fallback}catch{return fallback}}
state.cart=safeGet(STORAGE,[]).filter(x=>x&&Number.isInteger(x.id)&&PRODUCTS.some(p=>p.id===x.id)&&Number.isInteger(x.qty)&&x.qty>0&&x.qty<=99).map(x=>({id:x.id,qty:x.qty,note:String(x.note||'').slice(0,250)}));
state.generalNote=String(safeGet('majalis_basket_general_note_v1','')||'').slice(0,500);
try{const c=JSON.parse(sessionStorage.getItem('majalis_preview_customer_v1')||'{}');if(c&&typeof c==='object')for(const k of Object.keys(state.customer))state.customer[k]=String(c[k]||'').slice(0,120)}catch{}
state.favorites=safeGet(FAV_KEY,[]).filter(n=>Number.isInteger(n)&&PRODUCTS.some(p=>p.id===n));
function save(){try{localStorage.setItem(STORAGE,JSON.stringify(state.cart));localStorage.setItem(FAV_KEY,JSON.stringify(state.favorites));localStorage.setItem('majalis_basket_general_note_v1',JSON.stringify(state.generalNote||''))}catch{}}
function money(n){return Number(n).toLocaleString('ar-SA')+' ر.س'}
function imageFor(p){return p.demo?fallbackFor(p):'assets/products/'+String(p.id).padStart(2,'0')+'.webp'}
function fallbackFor(p){return 'https://images.unsplash.com/'+p.photo+'?auto=format&fit=crop&w=650&q=78'}
function imgTag(p,className='',alt=true){return '<img class="'+className+'" src="'+imageFor(p)+'" data-fallback="'+fallbackFor(p)+'" alt="'+(alt?p.name:'')+'" loading="lazy">'}
function photoError(e){const t=e.target;if(t.tagName==='IMG'&&t.dataset.fallback&&t.src!==t.dataset.fallback){t.src=t.dataset.fallback;t.removeAttribute('data-fallback')}}
document.addEventListener('error',photoError,true);
function currentPath(){const h=decodeURIComponent(location.hash.slice(1));return h.startsWith('/')?h:'/'}
function route(path){location.hash='#'+path;if(currentPath()===path)render()}
function count(){return state.cart.reduce((s,l)=>s+l.qty,0)}
function total(){return state.cart.reduce((s,l)=>s+(PRODUCTS.find(p=>p.id===l.id)?.price||0)*l.qty,0)}
function updateCounts(){el('headerCount').textContent=count();el('mobileCount').textContent=count()}
function notify(message){const t=el('toast');t.textContent=message;t.hidden=false;clearTimeout(notify.timer);notify.timer=setTimeout(()=>t.hidden=true,2600)}
function productById(id){return PRODUCTS.find(p=>p.id===Number(id))}
const RECENTS_KEY='majalis_recent_product_ids_v1';
let recentlyViewed=safeGet(RECENTS_KEY,[]).filter(id=>Number.isInteger(id)&&PRODUCTS.some(p=>p.id===id)).slice(0,8);
function rememberViewed(id){recentlyViewed=[id,...recentlyViewed.filter(n=>n!==id)].slice(0,8);try{localStorage.setItem(RECENTS_KEY,JSON.stringify(recentlyViewed))}catch{}}
function recentShowcase(){const choices=recentlyViewed.map(productById).filter(Boolean).slice(0,8);return choices.length?productShowcase('شاهدتها مؤخرًا','ارجع للأصناف التي شاهدتها',choices.map(p=>p.id),'/menu','recent'):''}
function searchSuggestionMarkup(q){if(!q)return '';const list=PRODUCTS.filter(p=>p.name.includes(q)||p.category.includes(q)).slice(0,6);return '<div class="search-pop-head"><strong>نتائج سريعة</strong><span>'+list.length+(list.length===6?'+':'')+' نتائج مقترحة</span></div>'+(list.length?list.map(p=>'<button class="search-hit" data-product="'+p.id+'">'+imgTag(p)+'<span><strong>'+p.name+'</strong><small>'+p.category+(p.demo?' · تجريبي':'')+'</small></span><b>'+money(p.price)+'</b></button>').join(''):'<div class="search-no-results">لا توجد نتائج مطابقة، جرّب كلمة أخرى.</div>')+'<button class="search-all" data-search-all>عرض جميع نتائج البحث ←</button>'}
function updateSuggestions(){const panel=el('searchSuggestions'),q=el('globalSearch')?.value.trim()||'';panel.hidden=!q;panel.innerHTML=q?searchSuggestionMarkup(q):''}

function addItem(id,qty=1,note=''){const p=productById(id);if(!p)return;const normalized=String(note||'').trim().slice(0,250);const previous=state.cart.find(x=>x.id===p.id&&x.note===normalized);if(previous)previous.qty=Math.min(99,previous.qty+qty);else state.cart.push({id:p.id,qty:Math.min(99,qty),note:normalized});save();updateCounts();notify('تمت إضافة '+p.name+' إلى السلة');renderCartArea()}
function refreshCartPage(){const y=window.scrollY;renderCart();updateCounts();requestAnimationFrame(()=>{const max=Math.max(0,document.documentElement.scrollHeight-window.innerHeight);window.scrollTo({top:Math.min(y,max),behavior:'instant'})})}
function changeCart(index,delta){const l=state.cart[index];if(!l)return;l.qty+=delta;if(l.qty<=0)state.cart.splice(index,1);else l.qty=Math.min(99,l.qty);save();updateCounts();if(currentPath()==='/cart')refreshCartPage();else render()}
function removeCart(index){state.cart.splice(index,1);save();updateCounts();if(currentPath()==='/cart')refreshCartPage();else render()}
function toggleFavorite(id){const i=state.favorites.indexOf(id);if(i<0)state.favorites.push(id);else state.favorites.splice(i,1);save();render()}
function sectionHeading(title,desc='',extra=''){return '<div class="panel-head"><div><h2>'+title+'</h2>'+(desc?'<p>'+desc+'</p>':'')+'</div>'+extra+'</div>'}
function card(p){const f=state.favorites.includes(p.id);return '<article class="product-card"><div style="position:relative"><button class="card-photo" data-product="'+p.id+'" aria-label="تفاصيل '+p.name+'">'+imgTag(p)+'</button>'+(p.demo?'<span class="demo-sticker">تجريبي</span>':'')+'<button class="card-fav '+(f?'saved':'')+'" data-fav="'+p.id+'" aria-label="'+(f?'إزالة من المفضلة':'إضافة للمفضلة')+'" aria-pressed="'+f+'">'+(f?'♥':'♡')+'</button></div><div class="card-body"><button class="card-title" data-product="'+p.id+'">'+p.name+'</button><p class="card-category">'+p.category+'</p><div class="card-bottom"><span class="card-price">'+money(p.price)+'</span><button class="add-button" data-product="'+p.id+'" aria-label="عرض وإضافة '+p.name+'">+</button></div></div></article>'}
function cartContent(){if(!state.cart.length)return '<div class="cart-empty"><div class="cart-icon">🛍️</div><strong>سلتك تنتظر طلبك</strong><p>اختر وجباتك المفضلة، ثم راجع تفاصيل الطلب هنا.</p><button class="outlined" data-go="/menu">تصفح الأطباق</button></div>';return '<div class="cart-lines">'+state.cart.map((l,i)=>{const p=productById(l.id);return '<div class="cart-line">'+imgTag(p)+'<div class="cart-line-info"><strong>'+p.name+'</strong><small>'+(l.note?'ملاحظة: '+escapeHtml(l.note):'بدون ملاحظات')+'</small><div class="cart-line-row"><strong>'+money(p.price*l.qty)+'</strong><div class="stepper"><button data-dec="'+i+'" aria-label="تقليل">−</button><span>'+l.qty+'</span><button data-inc="'+i+'" aria-label="زيادة">+</button></div></div></div></div>'}).join('')+'</div>'}
function sideCart(){return '<aside class="side-cart" id="cartArea"><div class="cart-head"><h2>🛍️ سلة مشترياتك</h2>'+(count()?'<button data-clear>إفراغ السلة</button>':'')+'</div>'+cartContent()+'<div class="cart-footer"><div class="total-row"><span>الإجمالي التجريبي</span><span>'+money(total())+'</span></div><button class="solid-action full" data-go="/cart" '+(!count()?'disabled':'')+'>راجع طلبك ←</button><p>الأسعار توضيحية؛ لا يشمل الإجمالي رسوم توصيل أو ضرائب إضافية غير معتمدة.</p></div></aside>'}
function renderCartArea(){const box=el('cartArea');if(box)box.outerHTML=sideCart()}
function filterProducts(){let rows=PRODUCTS.filter(p=>(state.category==='الكل'||p.category===state.category)&&p.name.includes(state.query));if(state.sort==='asc')rows.sort((a,b)=>a.price-b.price);if(state.sort==='desc')rows.sort((a,b)=>b.price-a.price);if(state.sort==='name')rows.sort((a,b)=>a.name.localeCompare(b.name,'ar'));if(state.sort==='fav')rows=rows.filter(p=>state.favorites.includes(p.id));return rows}
function quickNav(){const choices=['الكل',...CATEGORIES,'المفضلة'];return '<div class="quick-nav" id="categoryNav">'+choices.map(c=>'<button class="'+((state.category===c||(c==='المفضلة'&&state.sort==='fav'))?'active':'')+'" data-category="'+c+'">'+c+'</button>').join('')+'</div>'}

function setHeroSlide(index,manual=false){const track=el('heroTrack');if(!track)return;heroActive=(index+HERO_SLIDES.length)%HERO_SLIDES.length;if(manual)heroPauseUntil=Date.now()+9500;track.style.transform='translate3d('+(heroActive*100)+'%,0,0)';document.querySelectorAll('.hero-slide').forEach((slide,i)=>{slide.setAttribute('aria-hidden',String(i!==heroActive));slide.inert=i!==heroActive});document.querySelectorAll('[data-hero-index]').forEach((dot,i)=>{dot.classList.toggle('active',i===heroActive);dot.setAttribute('aria-current',String(i===heroActive))});const indexLabel=el('heroIndex');if(indexLabel)indexLabel.textContent=(heroActive+1)+' / '+HERO_SLIDES.length}

let carouselTimer=null,carouselPauseUntil=0;
function carouselElements(id){const rail=el(id);return rail&&rail.querySelectorAll?{rail,cards:[...rail.querySelectorAll('.product-card')]}:null}
function slideHomeRail(id,delta,manual=false){const entry=carouselElements(id);if(!entry||entry.cards.length<2)return;const {rail,cards}=entry;const maxScroll=Math.max(0,rail.scrollWidth-rail.clientWidth);if(maxScroll<1)return;const gap=parseFloat(window.getComputedStyle?.(rail).gap)||13;const step=(cards[0].getBoundingClientRect?.().width||cards[0].offsetWidth||200)+gap;const maxIndex=Math.max(0,Math.ceil(maxScroll/step));const current=carouselPositions.get(id)||0;const next=(current+delta+maxIndex+1)%(maxIndex+1);carouselPositions.set(id,next);if(manual)carouselPauseUntil=Date.now()+9000;const offset=Math.min(maxScroll,next*step);const behavior=window.matchMedia?.('(prefers-reduced-motion: reduce)').matches?'instant':'smooth';rail.scrollTo({left:-offset,behavior});const counter=el('counter-'+id);if(counter)counter.textContent=(next+1)+' / '+(maxIndex+1)}
function stopHomeCarousel(){if(carouselTimer!==null){clearInterval(carouselTimer);carouselTimer=null}}
function startHomeCarousel(){stopHomeCarousel();carouselPositions.clear();if(window.matchMedia?.('(prefers-reduced-motion: reduce)').matches)return;const rails=[...document.querySelectorAll('[data-auto-rail]')];rails.forEach(rail=>{carouselPositions.set(rail.id,0);rail.addEventListener('pointerenter',()=>{rail.dataset.hovered='true'});rail.addEventListener('pointerleave',()=>{rail.dataset.hovered='false'});rail.addEventListener('focusin',()=>{rail.dataset.focused='true'});rail.addEventListener('focusout',()=>{rail.dataset.focused='false'});rail.addEventListener('pointerdown',()=>{carouselPauseUntil=Date.now()+9000});rail.addEventListener('touchstart',()=>{carouselPauseUntil=Date.now()+9000},{passive:true});rail.addEventListener('wheel',()=>{carouselPauseUntil=Date.now()+9000},{passive:true})});if(!rails.length)return;carouselTimer=setInterval(()=>{if(document.hidden||Date.now()<carouselPauseUntil)return;for(const rail of rails){if(!rail.isConnected||rail.dataset.hovered==='true'||rail.dataset.focused==='true')continue;slideHomeRail(rail.id,1)}},3000)}

function render(){stopHomeCarousel();stopHeroSlider();const path=currentPath();const m=path.match(/^\/product\/(\d+)$/);if(m)renderDetail(Number(m[1]));else if(path==='/cart')renderCart();else if(path==='/checkout')checkoutPage();else if(path==='/seating')renderSeating();else if(path==='/menu')renderMenu();else if(path==='/offers')renderOffers();else if(path==='/favorites')renderFavorites();else if(path==='/orders')renderOrders();else if(path==='/account')renderAccount();else if(path==='/addresses')renderAddresses();else if(path==='/help')renderHelp();else renderHome();if(path==='/'){startHomeCarousel();startHeroSlider()}updateCounts();el('globalSearch').value=state.query;document.querySelectorAll('.mobile-bottom button').forEach(b=>b.classList.toggle('active',b.dataset.route===path));window.scrollTo({top:0,behavior:'instant'})}
document.addEventListener('click',e=>{const heroMove=e.target.closest('[data-hero-move]');if(heroMove){setHeroSlide(heroActive+Number(heroMove.dataset.heroMove),true);return}const heroDot=e.target.closest('[data-hero-index]');if(heroDot){setHeroSlide(Number(heroDot.dataset.heroIndex),true);return}const slideBtn=e.target.closest('[data-slide-dir]');if(slideBtn){slideHomeRail(slideBtn.dataset.slideTrack,Number(slideBtn.dataset.slideDir),true);return}if(e.target.closest('[data-search-all]')){el('searchSuggestions').hidden=true;route('/menu');return}
if(e.target.closest('#goCheckout,#goCheckoutMobile')){route('/checkout');return}
const payMode=e.target.closest('[data-checkout-mode]');if(payMode){state.fulfillment=payMode.dataset.checkoutMode;checkoutPage();return}
if(e.target.closest('#nationalAddressRequest')){requestAddressIntegration();return}
if(e.target.closest('#locateMe')){requestGeolocation();return}
if(e.target.closest('#checkoutReview')){checkoutPreview();return}
if(e.target.closest('#closeCheckoutPreview')){el('checkoutPreview').hidden=true;return}

const tab=e.target.closest('[data-order-tab]');if(tab){document.querySelectorAll('[data-order-tab]').forEach(b=>b.classList.toggle('active',b===tab));const panel=el('orderTabBody');if(panel)panel.innerHTML=tab.dataset.orderTab==='active'?'<span>▤</span><h2>لا توجد طلبات حالية</h2><p>ستظهر طلباتك الحقيقية هنا بعد الربط.</p><button class="solid-action" data-go="/menu">تصفّح المنيو</button>':'<span>◷</span><h2>لا توجد طلبات سابقة</h2><p>ستُعرض هنا الفواتير وسجل الطلبات عند تفعيل الخدمة.</p>';return}
if(e.target.closest('#accountLogin')){notify('تسجيل الدخول غير متصل بعد بنظام Odoo');return}
const routeBtn=e.target.closest('[data-route],[data-go]');if(routeBtn){route(routeBtn.dataset.route||routeBtn.dataset.go);return}
const product=e.target.closest('[data-product]');if(product){el('searchSuggestions').hidden=true;route('/product/'+product.dataset.product);return}
const fav=e.target.closest('[data-fav]');if(fav){toggleFavorite(Number(fav.dataset.fav));return}
const category=e.target.closest('[data-category]');if(category){if(category.dataset.category==='المفضلة'){state.category='الكل';state.sort='fav'}else{state.category=category.dataset.category;if(state.sort==='fav')state.sort='default'}if(currentPath()!=='/menu'){route('/menu');return}render();return}
if(e.target.closest('[data-reset]')){state.category='الكل';state.sort='default';state.query='';render();return}
const inc=e.target.closest('[data-inc]');if(inc){changeCart(Number(inc.dataset.inc),1);return}
const dec=e.target.closest('[data-dec]');if(dec){changeCart(Number(dec.dataset.dec),-1);return}
const rec=e.target.closest('[data-rec-add]');if(rec){addItem(Number(rec.dataset.recAdd));if(currentPath()==='/cart')refreshCartPage();return}
const noteEdit=e.target.closest('[data-note-edit]');if(noteEdit){const box=el('noteEditor-'+noteEdit.dataset.noteEdit);box.hidden=!box.hidden;if(!box.hidden)el('lineNote-'+noteEdit.dataset.noteEdit)?.focus();return}
const noteSave=e.target.closest('[data-note-save]');if(noteSave){const i=Number(noteSave.dataset.noteSave);if(state.cart[i]){state.cart[i].note=el('lineNote-'+i).value.trim().slice(0,250);save();refreshCartPage();notify('تم حفظ الملاحظة')}return}
const noteCancel=e.target.closest('[data-note-cancel]');if(noteCancel){el('noteEditor-'+noteCancel.dataset.noteCancel).hidden=true;return}
if(e.target.closest('#previewOrderMobile')){orderPreview();return}
if(e.target.closest('#closeOrderReview')){el('orderSummary').hidden=true;el('previewOrder')?.focus();return}
if(e.target.closest('#printSummary')){window.print();return}
const remove=e.target.closest('[data-remove]');if(remove){removeCart(Number(remove.dataset.remove));return}
if(e.target.closest('[data-demo-basket]')){state.cart=[{id:1,qty:2,note:'بدون فلفل'},{id:8,qty:1,note:'الجبن على الوجه'},{id:13,qty:1,note:''},{id:27,qty:3,note:''}];state.generalNote='هذه سلة تجريبية للعرض فقط';save();renderCart();updateCounts();notify('تم تحميل نموذج السلة التجريبية');return}
if(e.target.closest('[data-clear]')){if(!confirm('هل تريد إفراغ السلة بالكامل؟'))return;state.cart=[];save();render();return}
if(e.target.closest('[data-back]')){route(state.origin||'/menu');return}
if(e.target.closest('#qtyMinus')||e.target.closest('#qtyPlus')){const p=productById(state.currentProduct);state.quantity=Math.min(99,Math.max(1,state.quantity+(e.target.id==='qtyPlus'?1:-1)));el('selectedQty').textContent=state.quantity;el('selectedTotal').textContent=money(p.price*state.quantity);return}
if(e.target.closest('#addSelected')){addItem(state.currentProduct,state.quantity,el('itemNote')?.value||'');route('/cart');return}
if(e.target.closest('[data-mode]')){state.fulfillment=e.target.closest('[data-mode]').dataset.mode;refreshCartPage();return}
if(e.target.closest('#previewOrder')){orderPreview();return}
if(e.target.closest('#copySummary')){const t=el('summaryText');if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(t.value).then(()=>notify('تم نسخ ملخص السلة')).catch(()=>{t.select();notify('حدد النص لنسخه')})}else{t.select();notify('حدد النص لنسخه')}return}
});
document.addEventListener('input',e=>{if(e.target.id==='checkoutPhone'){state.customer.phone=e.target.value.slice(0,16);const feedback=el('checkoutFeedback');if(feedback)feedback.hidden=true;return}if(e.target.id==='generalOrderNote'){state.generalNote=e.target.value.slice(0,500);save()}const key=e.target.dataset?.customer;if(key&&Object.hasOwn(state.customer,key)){state.customer[key]=e.target.value.slice(0,120);saveCustomerSession();const warning=el('basketValidation');if(warning)warning.hidden=true}});
document.addEventListener('change',e=>{if(e.target.id==='sortSelect'){state.sort=e.target.value;render()}});
el('globalSearch').addEventListener('input',e=>{state.query=e.target.value.trim();state.category='الكل';updateSuggestions();if(currentPath()==='/menu'){const panel=el('catalog');if(panel)panel.innerHTML=catalog()}});
el('headerCart').onclick=()=>route('/cart');
el('globalSearch').addEventListener('focus',updateSuggestions);
document.addEventListener('click',e=>{if(!e.target.closest('.search-shell'))el('searchSuggestions').hidden=true});
el('globalSearch').addEventListener('keydown',e=>{if(e.key==='Escape')el('searchSuggestions').hidden=true;if(e.key==='Enter'){el('searchSuggestions').hidden=true;route('/menu')}});
const scrollBtn=el('scrollTop');scrollBtn.onclick=()=>window.scrollTo({top:0,behavior:'smooth'});window.addEventListener('scroll',()=>{scrollBtn.hidden=window.scrollY<650},{passive:true});
window.addEventListener('hashchange',render);render();
</script>
</body></html>
