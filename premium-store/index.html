function basketEmpty(){return '<div class="basket-empty"><div class="basket-empty-icon">🛍️</div><h2>سلتك فاضية… وش تشتهي اليوم؟</h2><p>اختر الأصناف المناسبة وأضفها للسلة، وستظهر هنا بالصور والكميات والأسعار.</p><div class="basket-empty-buttons"><button class="solid-action" data-go="/menu">تصفح قائمة الطعام ←</button><button class="outlined" data-demo-basket>عرض نموذج سلة تجريبية</button></div></div>'}
function basketOverview(){return '<aside class="basket-overview"><div class="basket-overview-header"><span>▤</span><div><h2>ملخص السلة</h2><small>'+state.cart.length+' أصناف · '+count()+' قطعة</small></div></div><div class="basket-prices"><div><span>مجموع الأصناف</span><strong>'+money(total())+'</strong></div><div><span>رسوم التوصيل</span><em>لم تُحدّد</em></div><div><span>الضرائب النهائية</span><em>غير محتسبة</em></div></div><div class="basket-total"><span>مجموع الأصناف فقط</span><strong>'+money(total())+'</strong></div><p class="basket-warning">المبلغ ليس إجمالي دفع نهائيًا. الأسعار والرسوم تجريبية حتى اعتماد البيانات وربط Odoo.</p><button class="basket-cta" id="previewOrder" '+(!count()?'disabled':'')+'>مراجعة ملخص الطلب ←</button><small class="basket-secure">🔒 لا تتم أي عملية دفع أو إرسال طلب</small></aside>'}
function renderCart(){const filled=state.cart.length>0;el('app').innerHTML='<div class="crumbs"><button data-go="/">الرئيسية</button> › <button data-go="/menu">القائمة</button> › <span>السلة</span></div><div class="basket-banner"><div><small>تجربة متجر مجالس العرب</small><h1>سلة المشتريات <b>'+count()+'</b></h1><p>راجع الأصناف والكمية وملاحظات التحضير قبل معاينة طلبك.</p></div><div class="basket-steps"><span class="selected">① السلة</span><span>② مراجعة</span><span>③ التأكيد بعد الربط</span></div></div><div class="basket-grid"><div class="basket-main"><section class="basket-section"><div class="basket-section-title"><div><h2>الأصناف المختارة</h2><small>'+state.cart.length+' أصناف · '+count()+' قطعة</small></div><div><button data-go="/menu" class="basket-more">＋ إضافة أصناف</button>'+(filled?'<button data-clear class="basket-clear">إفراغ السلة</button>':'')+'</div></div>'+(filled?'<div class="basket-items">'+state.cart.map(basketLine).join('')+'</div>':basketEmpty())+'</section>'+(filled?'<section class="basket-section"><h2>طريقة الحصول على الطلب</h2><p>الاختيار للمعاينة فقط، وليس حجزًا أو طلبًا.</p><div class="basket-methods"><button data-mode="pickup" class="'+(state.fulfillment==='pickup'?'selected':'')+'"><span>🏬</span><strong>استلام من الفرع</strong><small>الفرع والوقت غير محددين</small></button><button data-mode="delivery" class="'+(state.fulfillment==='delivery'?'selected':'')+'"><span>🛵</span><strong>توصيل</strong><small>رسوم ونطاق التوصيل غير معتمدين</small></button></div><div class="basket-info">'+modeText()+'</div><label for="generalOrderNote" class="basket-label">ملاحظات عامة للطلب (اختياري)</label><textarea id="generalOrderNote" maxlength="500" placeholder="ملاحظة تخص الطلب كاملًا — للمعاينة المحلية فقط">'+escapeHtml(state.generalNote||'')+'</textarea><small class="basket-disclaimer">تُحفظ هذه الملاحظة محليًا في المتصفح فقط.</small></section>'+customerForm()+paymentReadiness()+basketRelated():'')+'</div>'+basketOverview()+'</div><section id="orderSummary" hidden class="basket-section basket-preview"></section>'+(filled?'<div class="basket-mobile-total"><span>مجموع الأصناف <b>'+money(total())+'</b></span><button id="previewOrderMobile">مراجعة الطلب ←</button></div>':'')}
function modeText(){return state.fulfillment==='pickup'?'الاستلام من الفرع يحتاج تحديد الفرع وساعات العمل قبل تفعيل الطلبات.':'رسوم التوصيل، نطاق الخدمة وموعد الوصول غير معتمدة حتى الآن، لذلك لن نعرض سعرًا أو وعدًا بالتوصيل.'}
function renderSeating(){el('app').innerHTML='<div class="crumbs"><button data-go="/">الرئيسية</button> › <span>الجلسات والحجوزات</span></div><div class="section-bar"><h2>جلساتنا وترفيهنا</h2><small>الاستفسار عبر واتساب</small></div><p style="color:var(--muted);line-height:1.9">استكشف خيارات الجلسات والألعاب ومشاهدة المباريات. الحجز والتوفر يؤكدان بالتواصل المباشر مع الفرع.</p><div class="booking-cards">'+SEATING.map(x=>'<article class="booking-card"><img src="'+(x.local||'https://images.unsplash.com/'+x.photo+'?auto=format&fit=crop&w=750&q=78')+'" alt="'+x.name+'" loading="lazy"><div><h3>'+x.name+'</h3><p>'+x.description+'</p><a href="https://wa.me/966549792477?text='+encodeURIComponent(x.msg)+'" target="_blank" rel="noopener noreferrer">استفسر عن التوفر ←</a></div></article>').join('')+'</div>'}
function escapeHtml(v){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function summary(){return 'معاينة سلة مجالس العرب — ليست طلبًا مؤكدًا\n\n'+state.cart.map(l=>{const p=productById(l.id);return p.name+' × '+l.qty+' — '+money(p.price*l.qty)+(l.note?'\nملاحظة: '+l.note:'')}).join('\n')+'\n\nإجمالي الأصناف التجريبي: '+money(total())+'\nطريقة الخدمة المطلوبة: '+(state.fulfillment==='pickup'?'استلام من الفرع':'توصيل')+'\nاسم المستلم: '+(state.customer.name||'غير مدخل')+'\nالجوال: '+(state.customer.phone||'غير مدخل')+'\n'+(state.fulfillment==='delivery'?'عنوان التوصيل: '+[state.customer.city,state.customer.district,state.customer.street,state.customer.building,state.customer.unit,state.customer.landmark].filter(Boolean).join('، '):'الفرع المرغوب: '+(state.customer.pickupBranch||'غير محدد'))+'\nملاحظة عامة: '+(state.generalNote||'لا توجد')+'\nرسوم التوصيل والضرائب النهائية غير محسوبة أو معتمدة.\nلا يُرسل هذا الملخص للمطعم تلقائيًا.'}
function orderPreview(){if(!state.cart.length)return;if(!validateCustomer()){notify('يرجى استكمال بيانات التواصل أولًا');return}const o=el('orderSummary');if(!o)return;o.hidden=false;o.innerHTML='<div class="basket-review-title"><div><span>الخطوة الثانية · معاينة فقط</span><h2>مراجعة جميع التفاصيل</h2><p>هذه معاينة محلية لا تنشئ طلبًا ولا تؤكد استلامًا أو توصيلًا.</p></div><button id="closeOrderReview" class="outlined">إغلاق المعاينة</button></div><div class="basket-review-grid"><div><strong>المستلم</strong><p>'+escapeHtml(state.customer.name)+'</p><small>'+escapeHtml(state.customer.phone)+'</small></div><div><strong>طريقة الخدمة</strong><p>'+(state.fulfillment==='delivery'?'توصيل غير مفعّل':'استلام غير مفعّل')+'</p><small>'+(state.fulfillment==='delivery'?escapeHtml([state.customer.city,state.customer.district,state.customer.street].filter(Boolean).join('، ')):escapeHtml(state.customer.pickupBranch||'لم يحدد الفرع'))+'</small></div><div><strong>المنتجات</strong><p>'+count()+' قطعة</p><small>'+state.cart.length+' أصناف</small></div><div><strong>مجموع الأصناف</strong><p>'+money(total())+'</p><small>لا يشمل أي رسوم غير معتمدة</small></div></div><label class="basket-review-label" for="summaryText">تفاصيل الطلب القابلة للنسخ</label><textarea id="summaryText" class="note-input" readonly>'+escapeHtml(summary())+'</textarea><div class="basket-review-actions"><button class="solid-action" id="copySummary">نسخ التفاصيل</button><button class="outlined" id="printSummary">طباعة المعاينة</button><button class="outlined" data-go="/menu">متابعة التسوق</button></div><p class="basket-review-warning">لا يوجد زر تنفيذ طلب حقيقي حتى اعتماد المنتجات والفرع والأسعار والضرائب والدفع في Odoo 18.</p>';o.scrollIntoView({behavior:'smooth',block:'start'})}
function render(){const path=currentPath();const m=path.match(/^\/product\/(\d+)$/);if(m)renderDetail(Number(m[1]));else if(path==='/cart')renderCart();else if(path==='/seating')renderSeating();else if(path==='/menu')renderMenu();else renderHome();updateCounts();el('globalSearch').value=state.query;document.querySelectorAll('.mobile-bottom button').forEach(b=>b.classList.toggle('active',b.dataset.route===path));window.scrollTo({top:0,behavior:'instant'})}
document.addEventListener('click',e=>{
const routeBtn=e.target.closest('[data-route],[data-go]');if(routeBtn){route(routeBtn.dataset.route||routeBtn.dataset.go);return}
const product=e.target.closest('[data-product]');if(product){route('/product/'+product.dataset.product);return}
const fav=e.target.closest('[data-fav]');if(fav){toggleFavorite(Number(fav.dataset.fav));return}
const category=e.target.closest('[data-category]');if(category){if(category.dataset.category==='المفضلة'){state.category='الكل';state.sort='fav'}else{state.category=category.dataset.category;if(state.sort==='fav')state.sort='default'}render();return}
if(e.target.closest('[data-reset]')){state.category='الكل';state.sort='default';state.query='';render();return}
const inc=e.target.closest('[data-inc]');if(inc){changeCart(Number(inc.dataset.inc),1);return}
const dec=e.target.closest('[data-dec]');if(dec){changeCart(Number(dec.dataset.dec),-1);return}
const rec=e.target.closest('[data-rec-add]');if(rec){addItem(Number(rec.dataset.recAdd));if(currentPath()==='/cart')refreshCartPage();return}
const noteEdit=e.target.closest('[data-note-edit]');if(noteEdit){const box=el('noteEditor-'+noteEdit.dataset.noteEdit);box.hidden=!box.hidden;if(!box.hidden)el('lineNote-'+noteEdit.dataset.noteEdit)?.focus();return}
const noteSave=e.target.closest('[data-note-save]');if(noteSave){const i=Number(noteSave.dataset.noteSave);if(state.cart[i]){state.cart[i].note=el('lineNote-'+i).value.trim().slice(0,250);save();refreshCartPage();notify('تم حفظ الملاحظة')}return}
const noteCancel=e.target.closest('[data-note-cancel]');if(noteCancel){el('noteEditor-'+noteCancel.dataset.noteCancel).hidden=true;return}
if(e.target.closest('#previewOrderMobile')){orderPreview();return}
if(e.target.closest('#closeOrderReview')){el('orderSummary').hidden=true;el('previewOrder')?.focus();return}
if(e.target.closest('#printSummary')){window.print();return}
const remove=e.target.closest('[data-remove]');if(remove){removeCart(Number(remove.dataset.remove));return}
if(e.target.closest('[data-demo-basket]')){state.cart=[{id:1,qty:2,note:'بدون فلفل'},{id:8,qty:1,note:'الجبن على الوجه'},{id:13,qty:1,note:''},{id:27,qty:3,note:''}];state.generalNote='هذه سلة تجريبية للعرض فقط';save();renderCart();updateCounts();notify('تم تحميل نموذج السلة التجريبية');return}
if(e.target.closest('[data-clear]')){if(!confirm('هل تريد إفراغ السلة بالكامل؟'))return;state.cart=[];save();render();return}
if(e.target.closest('[data-back]')){route(state.origin||'/menu');return}
if(e.target.closest('#qtyMinus')||e.target.closest('#qtyPlus')){const p=productById(state.currentProduct);state.quantity=Math.min(99,Math.max(1,state.quantity+(e.target.id==='qtyPlus'?1:-1)));el('selectedQty').textContent=state.quantity;el('selectedTotal').textContent=money(p.price*state.quantity);return}
if(e.target.closest('#addSelected')){addItem(state.currentProduct,state.quantity,el('itemNote')?.value||'');route('/cart');return}
if(e.target.closest('[data-mode]')){state.fulfillment=e.target.closest('[data-mode]').dataset.mode;refreshCartPage();return}
if(e.target.closest('#previewOrder')){orderPreview();return}
if(e.target.closest('#copySummary')){const t=el('summaryText');if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(t.value).then(()=>notify('تم نسخ ملخص السلة')).catch(()=>{t.select();notify('حدد النص لنسخه')})}else{t.select();notify('حدد النص لنسخه')}return}
});
document.addEventListener('input',e=>{if(e.target.id==='generalOrderNote'){state.generalNote=e.target.value.slice(0,500);save()}const key=e.target.dataset?.customer;if(key&&Object.hasOwn(state.customer,key)){state.customer[key]=e.target.value.slice(0,120);saveCustomerSession();const warning=el('basketValidation');if(warning)warning.hidden=true}});
document.addEventListener('change',e=>{if(e.target.id==='sortSelect'){state.sort=e.target.value;render()}});
el('globalSearch').addEventListener('input',e=>{state.query=e.target.value.trim();state.category='الكل';if(currentPath()!=='/menu'&&currentPath()!=='/')route('/menu');else{const panel=el('catalog');if(panel)panel.innerHTML=catalog();}});
el('headerCart').onclick=()=>route('/cart');
window.addEventListener('hashchange',render);render();
</script>
</body></html>
