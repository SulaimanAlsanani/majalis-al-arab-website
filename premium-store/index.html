state.cart=safeGet(STORAGE,[]).filter(x=>x&&Number.isInteger(x.id)&&PRODUCTS.some(p=>p.id===x.id)&&Number.isInteger(x.qty)&&x.qty>0&&x.qty<=99).map(x=>({id:x.id,qty:x.qty,note:String(x.note||'').slice(0,250)}));
state.favorites=safeGet(FAV_KEY,[]).filter(n=>Number.isInteger(n)&&PRODUCTS.some(p=>p.id===n));
function save(){try{localStorage.setItem(STORAGE,JSON.stringify(state.cart));localStorage.setItem(FAV_KEY,JSON.stringify(state.favorites))}catch{}}
function money(n){return Number(n).toLocaleString('ar-SA')+' ر.س'}
function imageFor(p){return 'assets/products/'+String(p.id).padStart(2,'0')+'.webp'}
function fallbackFor(p){return 'https://images.unsplash.com/'+p.photo+'?auto=format&fit=crop&w=650&q=78'}
function imgTag(p,className='',alt=true){return '<img class="'+className+'" src="'+imageFor(p)+'" data-fallback="'+fallbackFor(p)+'" alt="'+(alt?p.name:'')+'" loading="lazy">'}
function photoError(e){const t=e.target;if(t.tagName==='IMG'&&t.dataset.fallback&&t.src!==t.dataset.fallback){t.src=t.dataset.fallback;t.removeAttribute('data-fallback')}}
document.addEventListener('error',photoError,true);
function currentPath(){const h=decodeURIComponent(location.hash.slice(1));return h.startsWith('/')?h:'/'}
function route(path){location.hash='#'+path;if(currentPath()===path)render()}
function count(){return state.cart.reduce((s,l)=>s+l.qty,0)}
function total(){return state.cart.reduce((s,l)=>s+(PRODUCTS.find(p=>p.id===l.id)?.price||0)*l.qty,0)}
function updateCounts(){el('headerCount').textContent=count();el('mobileCount').textContent=count()}
function notify(message){const t=el('toast');t.textContent=message;t.hidden=false;clearTimeout(notify.timer);notify.timer=setTimeout(()=>t.hidden=true,2600)}
function productById(id){return PRODUCTS.find(p=>p.id===Number(id))}
function addItem(id,qty=1,note=''){const p=productById(id);if(!p)return;const normalized=String(note||'').trim().slice(0,250);const previous=state.cart.find(x=>x.id===p.id&&x.note===normalized);if(previous)previous.qty=Math.min(99,previous.qty+qty);else state.cart.push({id:p.id,qty:Math.min(99,qty),note:normalized});save();updateCounts();notify('تمت إضافة '+p.name+' إلى السلة');renderCartArea()}
function changeCart(index,delta){const l=state.cart[index];if(!l)return;l.qty+=delta;if(l.qty<=0)state.cart.splice(index,1);else l.qty=Math.min(99,l.qty);save();updateCounts();render()}
function removeCart(index){state.cart.splice(index,1);save();updateCounts();render()}
function toggleFavorite(id){const i=state.favorites.indexOf(id);if(i<0)state.favorites.push(id);else state.favorites.splice(i,1);save();render()}
function sectionHeading(title,desc='',extra=''){return '<div class="panel-head"><div><h2>'+title+'</h2>'+(desc?'<p>'+desc+'</p>':'')+'</div>'+extra+'</div>'}
function card(p){const f=state.favorites.includes(p.id);return '<article class="product-card"><div style="position:relative"><button class="card-photo" data-product="'+p.id+'" aria-label="تفاصيل '+p.name+'">'+imgTag(p)+'</button><button class="card-fav '+(f?'saved':'')+'" data-fav="'+p.id+'" aria-label="'+(f?'إزالة من المفضلة':'إضافة للمفضلة')+'" aria-pressed="'+f+'">'+(f?'♥':'♡')+'</button></div><div class="card-body"><button class="card-title" data-product="'+p.id+'">'+p.name+'</button><p class="card-category">'+p.category+'</p><div class="card-bottom"><span class="card-price">'+money(p.price)+'</span><button class="add-button" data-product="'+p.id+'" aria-label="عرض وإضافة '+p.name+'">+</button></div></div></article>'}
function cartContent(){if(!state.cart.length)return '<div class="cart-empty"><div class="cart-icon">🛍️</div><strong>سلتك تنتظر طلبك</strong><p>اختر وجباتك المفضلة، ثم راجع تفاصيل الطلب هنا.</p><button class="outlined" data-go="/menu">تصفح الأطباق</button></div>';return '<div class="cart-lines">'+state.cart.map((l,i)=>{const p=productById(l.id);return '<div class="cart-line">'+imgTag(p)+'<div class="cart-line-info"><strong>'+p.name+'</strong><small>'+(l.note?'ملاحظة: '+escapeHtml(l.note):'بدون ملاحظات')+'</small><div class="cart-line-row"><strong>'+money(p.price*l.qty)+'</strong><div class="stepper"><button data-dec="'+i+'" aria-label="تقليل">−</button><span>'+l.qty+'</span><button data-inc="'+i+'" aria-label="زيادة">+</button></div></div></div></div>'}).join('')+'</div>'}
function sideCart(){return '<aside class="side-cart" id="cartArea"><div class="cart-head"><h2>🛍️ سلة مشترياتك</h2>'+(count()?'<button data-clear>إفراغ السلة</button>':'')+'</div>'+cartContent()+'<div class="cart-footer"><div class="total-row"><span>الإجمالي التجريبي</span><span>'+money(total())+'</span></div><button class="solid-action full" data-go="/cart" '+(!count()?'disabled':'')+'>راجع طلبك ←</button><p>الأسعار توضيحية؛ لا يشمل الإجمالي رسوم توصيل أو ضرائب إضافية غير معتمدة.</p></div></aside>'}
function renderCartArea(){const box=el('cartArea');if(box)box.outerHTML=sideCart()}
function filterProducts(){let rows=PRODUCTS.filter(p=>(state.category==='الكل'||p.category===state.category)&&p.name.includes(state.query));if(state.sort==='asc')rows.sort((a,b)=>a.price-b.price);if(state.sort==='desc')rows.sort((a,b)=>b.price-a.price);if(state.sort==='name')rows.sort((a,b)=>a.name.localeCompare(b.name,'ar'));if(state.sort==='fav')rows=rows.filter(p=>state.favorites.includes(p.id));return rows}
function quickNav(){const choices=['الكل',...CATEGORIES,'المفضلة'];return '<div class="quick-nav" id="categoryNav">'+choices.map(c=>'<button class="'+((state.category===c||(c==='المفضلة'&&state.sort==='fav'))?'active':'')+'" data-category="'+c+'">'+c+'</button>').join('')+'</div>'}
function catalog(){const rows=filterProducts();return '<div class="panel-head"><div><h2>'+(state.category==='الكل'?'قائمة الطعام':state.category)+'</h2><p>اختر وجبتك، ثم خصص الكمية والملاحظات قبل إضافتها.</p></div><select id="sortSelect" class="sort-select" aria-label="ترتيب الأصناف"><option value="default" '+(state.sort==='default'?'selected':'')+'>ترتيب القائمة</option><option value="asc" '+(state.sort==='asc'?'selected':'')+'>السعر: الأقل أولًا</option><option value="desc" '+(state.sort==='desc'?'selected':'')+'>السعر: الأعلى أولًا</option><option value="name" '+(state.sort==='name'?'selected':'')+'>حسب الاسم</option></select></div>'+(rows.length?'<div class="product-grid">'+rows.map(card).join('')+'</div>':'<div class="cart-empty"><strong>لم نعثر على أصناف مطابقة</strong><p>جرّب اسمًا آخر أو اختر قسمًا مختلفًا.</p><button class="outlined" data-reset>مسح البحث</button></div>')}
function hero(){return '<div class="crumbs"><span>الرئيسية</span><span>›</span><span>مجالس العرب</span></div><section class="restaurant-hero"><div class="restaurant-cover"><div class="cover-decoration"></div><div class="cover-word">مجالس العرب<small>ضيافتك تبدأ من هنا</small></div></div><div class="restaurant-heading"><div class="restaurant-badge">☕</div><div class="restaurant-copy"><h1>مجالس العرب</h1><p>فطور سعودي · عريكة ومعصوب · مشروبات · جلسات</p><div class="restaurant-tags"><span>متجر تجريبي</span><span>28 صنفًا</span><span>الاستلام والتوصيل: يتطلبان تفعيلًا</span></div></div><button class="outlined" data-go="/seating">الجلسات والحجوزات</button></div><div class="service-notice">الصور والأسعار تقديرية للمعاينة. لا يمكن إنشاء طلب حقيقي أو تأكيد توصيل أو استلام قبل ربط المتجر بنظام Odoo والتحقق من بيانات الفرع.</div></section>'}
function renderHome(){el('app').innerHTML=hero()+quickNav()+'<div class="shop-layout"><section class="catalog-panel" id="catalog">'+catalog()+'</section>'+sideCart()+'</div>'}
function renderMenu(){renderHome();document.querySelector('.restaurant-hero')?.remove();document.querySelector('.crumbs')?.remove()}
function renderDetail(id){const p=productById(id);if(!p){route('/');return}const related=PRODUCTS.filter(x=>x.id!==p.id&&x.category===p.category).slice(0,3);const crumb='<button class="back-link" data-back>→ العودة إلى قائمة الطعام</button>';el('app').innerHTML=crumb+'<article class="detail-route"><div class="detail-layout"><div class="detail-image">'+imgTag(p)+'</div><div class="detail-info"><span class="eyebrow">'+p.category+'</span><h1>'+p.name+'</h1><div class="amount">'+money(p.price)+'</div><p class="detail-description">اختر الكمية المناسبة وسجّل ملاحظات التحضير إن رغبت. لا تتوفر بيانات مؤكدة عن المكونات والحساسية والسعرات حتى استكمال ربط القائمة.</p><div class="option-box"><h3>التخصيص والإضافات</h3><p>الخيارات المعتمدة لهذا المنتج لم تُربط بعد. لن نعرض إضافات أو رسومًا غير مؤكدة.</p></div><label class="field-label" for="itemNote">ملاحظات للمطبخ (اختياري)</label><textarea class="note-input" maxlength="250" id="itemNote" placeholder="مثال: بدون فلفل — يخضع لتأكيد المطعم"></textarea><div class="detail-controls"><div class="stepper"><button id="qtyMinus" aria-label="تقليل الكمية">−</button><span id="selectedQty">1</span><button id="qtyPlus" aria-label="زيادة الكمية">+</button></div><button class="solid-action" id="addSelected">أضف للسلة · <span id="selectedTotal">'+money(p.price)+'</span></button></div></div></div></article>'+(related.length?'<section class="recs"><h2>أصناف قد تعجبك</h2><div class="product-grid">'+related.map(card).join('')+'</div></section>':'');state.quantity=1;state.note='';state.currentProduct=id;state.origin='/menu'}
function renderCart(){const lines=state.cart.map((l,i)=>{const p=productById(l.id);return '<div class="order-line">'+imgTag(p)+'<div style="flex:1"><strong>'+p.name+'</strong><small>'+money(p.price)+' × '+l.qty+'</small>'+(l.note?'<small>ملاحظة: '+escapeHtml(l.note)+'</small>':'')+'<button class="edit" data-product="'+l.id+'">تفاصيل المنتج</button></div><strong>'+money(p.price*l.qty)+'</strong><button class="outlined" data-remove="'+i+'" aria-label="حذف الصنف">×</button></div>'}).join('');el('app').innerHTML='<div class="crumbs"><button data-go="/">الرئيسية</button> › <span>السلة</span></div><div class="section-bar"><h2>سلة مشترياتك</h2><small>'+count()+' قطعة</small></div><div class="cart-route"><section class="checkout-panel"><h2>الأصناف المختارة</h2>'+(lines?'<div class="order-lines">'+lines+'</div>':'<div class="cart-empty"><div class="cart-icon">🛍️</div><strong>سلتك فارغة</strong><p>أضف ما تشتهيه من قائمة الطعام.</p><button class="solid-action" data-go="/menu">تصفح القائمة</button></div>')+'<h2 style="margin-top:30px">طريقة استلام الطلب</h2><div class="fulfillment"><button data-mode="pickup" class="'+(state.fulfillment==='pickup'?'selected':'')+'">🏬 استلام من الفرع</button><button data-mode="delivery" class="'+(state.fulfillment==='delivery'?'selected':'')+'">🛵 توصيل</button></div><div class="note-box" id="modeNotice">'+modeText()+'</div></section><aside class="total-box"><h2 style="margin:0 0 14px">ملخص السلة</h2><div class="price-line"><span>مجموع الأصناف</span><span>'+money(total())+'</span></div><div class="price-line muted"><span>رسوم التوصيل</span><span>غير محددة</span></div><hr style="border:0;border-top:1px solid #eee"><div class="price-line"><strong>إجمالي الأصناف</strong><strong>'+money(total())+'</strong></div><button class="solid-action full" id="previewOrder" '+(!count()?'disabled':'')+'>عرض ملخص الطلب</button><p class="muted">لا يُنفذ دفع أو طلب أو تأكيد حجز في هذه النسخة.</p></aside></div><div id="orderSummary" hidden class="checkout-panel" style="margin-top:22px"></div>'}
function modeText(){return state.fulfillment==='pickup'?'الاستلام من الفرع يحتاج تحديد الفرع وساعات العمل قبل تفعيل الطلبات.':'رسوم التوصيل، نطاق الخدمة وموعد الوصول غير معتمدة حتى الآن، لذلك لن نعرض سعرًا أو وعدًا بالتوصيل.'}
function renderSeating(){el('app').innerHTML='<div class="crumbs"><button data-go="/">الرئيسية</button> › <span>الجلسات والحجوزات</span></div><div class="section-bar"><h2>جلساتنا وترفيهنا</h2><small>الاستفسار عبر واتساب</small></div><p style="color:var(--muted);line-height:1.9">استكشف خيارات الجلسات والألعاب ومشاهدة المباريات. الحجز والتوفر يؤكدان بالتواصل المباشر مع الفرع.</p><div class="booking-cards">'+SEATING.map(x=>'<article class="booking-card"><img src="'+(x.local||'https://images.unsplash.com/'+x.photo+'?auto=format&fit=crop&w=750&q=78')+'" alt="'+x.name+'" loading="lazy"><div><h3>'+x.name+'</h3><p>'+x.description+'</p><a href="https://wa.me/966549792477?text='+encodeURIComponent(x.msg)+'" target="_blank" rel="noopener noreferrer">استفسر عن التوفر ←</a></div></article>').join('')+'</div>'}
function escapeHtml(v){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function summary(){return 'معاينة سلة مجالس العرب — ليست طلبًا مؤكدًا\n\n'+state.cart.map(l=>{const p=productById(l.id);return p.name+' × '+l.qty+' — '+money(p.price*l.qty)+(l.note?'\nملاحظة: '+l.note:'')}).join('\n')+'\n\nإجمالي الأصناف التجريبي: '+money(total())+'\nطريقة الخدمة المطلوبة: '+(state.fulfillment==='pickup'?'استلام من الفرع':'توصيل')+'\nرسوم التوصيل والضرائب النهائية غير محسوبة أو معتمدة.\nلا يُرسل هذا الملخص للمطعم تلقائيًا.'}
function orderPreview(){const o=el('orderSummary');if(!o)return;o.hidden=false;o.innerHTML='<h2>معاينة ملخص الطلب</h2><p>نسخة للمراجعة أو النسخ فقط، ولا تنشئ طلبًا فعليًا.</p><textarea id="summaryText" class="note-input" style="min-height:250px" readonly>'+escapeHtml(summary())+'</textarea><p><button class="solid-action" id="copySummary">نسخ الملخص</button></p>';o.scrollIntoView({behavior:'smooth',block:'start'})}
function render(){const path=currentPath();const m=path.match(/^\/product\/(\d+)$/);if(m)renderDetail(Number(m[1]));else if(path==='/cart')renderCart();else if(path==='/seating')renderSeating();else if(path==='/menu')renderMenu();else renderHome();updateCounts();el('globalSearch').value=state.query;document.querySelectorAll('.mobile-bottom button').forEach(b=>b.classList.toggle('active',b.dataset.route===path));window.scrollTo({top:0,behavior:'instant'})}
document.addEventListener('click',e=>{
const routeBtn=e.target.closest('[data-route],[data-go]');if(routeBtn){route(routeBtn.dataset.route||routeBtn.dataset.go);return}
const product=e.target.closest('[data-product]');if(product){route('/product/'+product.dataset.product);return}
const fav=e.target.closest('[data-fav]');if(fav){toggleFavorite(Number(fav.dataset.fav));return}
const category=e.target.closest('[data-category]');if(category){if(category.dataset.category==='المفضلة'){state.category='الكل';state.sort='fav'}else{state.category=category.dataset.category;if(state.sort==='fav')state.sort='default'}render();return}
if(e.target.closest('[data-reset]')){state.category='الكل';state.sort='default';state.query='';render();return}
const inc=e.target.closest('[data-inc]');if(inc){changeCart(Number(inc.dataset.inc),1);return}
const dec=e.target.closest('[data-dec]');if(dec){changeCart(Number(dec.dataset.dec),-1);return}
const remove=e.target.closest('[data-remove]');if(remove){removeCart(Number(remove.dataset.remove));return}
if(e.target.closest('[data-clear]')){state.cart=[];save();render();return}
if(e.target.closest('[data-back]')){route(state.origin||'/menu');return}
if(e.target.closest('#qtyMinus')||e.target.closest('#qtyPlus')){const p=productById(state.currentProduct);state.quantity=Math.min(99,Math.max(1,state.quantity+(e.target.id==='qtyPlus'?1:-1)));el('selectedQty').textContent=state.quantity;el('selectedTotal').textContent=money(p.price*state.quantity);return}
if(e.target.closest('#addSelected')){addItem(state.currentProduct,state.quantity,el('itemNote')?.value||'');route('/cart');return}
if(e.target.closest('[data-mode]')){state.fulfillment=e.target.closest('[data-mode]').dataset.mode;renderCart();return}
if(e.target.closest('#previewOrder')){orderPreview();return}
if(e.target.closest('#copySummary')){const t=el('summaryText');if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(t.value).then(()=>notify('تم نسخ ملخص السلة')).catch(()=>{t.select();notify('حدد النص لنسخه')})}else{t.select();notify('حدد النص لنسخه')}return}
});
document.addEventListener('change',e=>{if(e.target.id==='sortSelect'){state.sort=e.target.value;render()}});
el('globalSearch').addEventListener('input',e=>{state.query=e.target.value.trim();state.category='الكل';if(currentPath()!=='/menu'&&currentPath()!=='/')route('/menu');else{const panel=el('catalog');if(panel)panel.innerHTML=catalog();}});
el('headerCart').onclick=()=>route('/cart');
window.addEventListener('hashchange',render);render();
</script>
</body></html>
