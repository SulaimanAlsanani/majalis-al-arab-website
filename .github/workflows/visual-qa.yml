name: Visual QA - desktop and mobile
on:
  push:
    branches: [main]
    paths:
      - '*.html'
      - 'assets/**'
      - 'scripts/visual-qa.mjs'
      - '.github/workflows/visual-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  visual-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright and Chromium
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Serve site and visually inspect pages
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/majalis-http.log 2>&1 &
          sleep 2
          node scripts/visual-qa.mjs
      - name: Upload desktop and mobile screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: majalis-visual-qa
          path: visual-artifacts/
          if-no-files-found: warn
