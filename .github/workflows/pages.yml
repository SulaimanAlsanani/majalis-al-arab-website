name: Deploy static website to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate static website
        run: python3 scripts/check_site.py
      - name: Audit accessibility and sitemap quality
        run: python3 scripts/check_quality.py
      - name: Validate JavaScript syntax
        run: |
          node --check assets/app.js
          node --check assets/detail.js
          node --check assets/catalog.js
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload static artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
