name: Deploy static website to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Check Python script syntax
        run: python3 -m py_compile scripts/check_site.py scripts/check_quality.py scripts/check_live.py
      - name: Validate static website
        run: python3 scripts/check_site.py
      - name: Audit accessibility and sitemap quality
        run: python3 scripts/check_quality.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate JavaScript syntax
        run: |
          node --check assets/app.js
          node --check assets/detail.js
          node --check assets/signature.js
          node --check assets/catalog.js
          node --check assets/faq.js
      # Block production release when responsive functionality or navigation regresses.
      - name: Install Playwright for pre-deploy visual regression gate
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Gate deployment on mobile, tablet and desktop visual QA
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/majalis-http.log 2>&1 &
          sleep 2
          node scripts/visual-qa.mjs
      - name: Upload pre-deploy visual QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: majalis-predeploy-qa
          path: visual-artifacts/
          if-no-files-found: warn
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Package public website only
        run: |
          mkdir -p dist/assets
          cp -- ./*.html robots.txt sitemap.xml .nojekyll dist/
          cp -R assets/. dist/assets/
          test -s dist/index.html
          test -s dist/assets/styles.css
          test -s dist/assets/signature.js
          test -f dist/404.html
          test -f dist/.nojekyll
          printf '{"commit":"%s"}\n' "$GITHUB_SHA" > dist/build-info.json
          test -s dist/build-info.json
      - name: Minify production CSS and JavaScript
        run: |
          npm install --no-save esbuild@0.25.12
          for css in dist/assets/*.css; do
            npx --no-install esbuild "$css" --minify --outfile="$css.min"
            mv "$css.min" "$css"
          done
          for js in dist/assets/*.js; do
            npx --no-install esbuild "$js" --minify --outfile="$js.min"
            mv "$js.min" "$js"
            node --check "$js"
          done
          python3 scripts/check_build_sizes.py
      - name: Gate production artifact on responsive browser QA
        run: |
          python3 -m http.server 4174 --directory dist --bind 127.0.0.1 >/tmp/majalis-production-http.log 2>&1 &
          sleep 2
          SITE_ORIGIN=http://127.0.0.1:4174 node scripts/visual-qa.mjs
      - name: Upload static artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
        continue-on-error: true
      - name: Retry deployment if GitHub artifact API was temporarily unavailable
        if: steps.deployment.outcome == 'failure'
        run: sleep 15
      - name: Retry Pages deployment
        if: steps.deployment.outcome == 'failure'
        id: deployment_retry
        uses: actions/deploy-pages@v4
