          file premium-store/assets/categories/appetizers.png | grep -q "PNG image"
          curl --fail --location --silent --show-error --retry 3 --max-time 100 "https://media.canva.com/v2/image-resize/format:PNG/height:200/quality:100/uri:ifs%3A%2F%2FM%2Fa8d66039-80ba-462d-bb35-a893fa227f48/watermark:F/width:200?csig=AAAAAAAAAAAAAAAAAAAAAOWr6SUAKLBuX9uZojbMMGvRjZcfkaXKaVKjMfnucRlN&exp=1795250106&osig=AAAAAAAAAAAAAAAAAAAAAKQ34F7tZNIdhN7GMiG4670cRhIHeUjqt7e08oIOvrSW&signer=media-rpc&token=AAIAAU0AJGE4ZDY2MDM5LTgwYmEtNDYyZC1iYjM1LWE4OTNmYTIyN2Y0OAAAAAABof0-rpDpZpSQnzagTvSyNL3BoOYtd-4UeNi5hvtXA5yCouTp9g&x-canva-quality=thumbnail" -o premium-store/assets/categories/family-meals.png
