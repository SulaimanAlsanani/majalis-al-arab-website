      - name: Commit updated category photographs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f premium-store/assets/categories
          git diff --cached --quiet || (git commit -m "assets: replace ten restaurant categories with HD plate photos" && git push)
