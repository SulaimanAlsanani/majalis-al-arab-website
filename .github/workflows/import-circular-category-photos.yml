          file premium-store/assets/categories/appetizers.png | grep -q 'PNG image'
          curl --fail --location --silent --show-error --retry 3 --max-time 90 "https://media.canva.com/v2/image-resize/format:PNG/height:128/quality:100/uri:ifs%3A%2F%2FM%2F19268444-aa90-4f2b-9f49-6f09f414aa52/watermark:F/width:128?csig=AAAAAAAAAAAAAAAAAAAAAN4thhlrypHbAVI7R91_vTdsYwsPTPT48B9sDj7Bsaoz&exp=1795249491&osig=AAAAAAAAAAAAAAAAAAAAAO5hmG3cwk5hPmO9efZuF0eOfj_El6jPV94LpqvwLtrm&signer=media-rpc&token=AAIAAU0AJDE5MjY4NDQ0LWFhOTAtNGYyYi05ZjQ5LTZmMDlmNDE0YWE1MgAAAAABof01TDhRNrOK0cp2BNDvkjeRxnMajTEI2JGcu_SUXmSXnn_fjw&x-canva-quality=thumbnail" -o premium-store/assets/categories/family-meals.png
          file premium-store/assets/categories/family-meals.png | grep -q 'PNG image'
      - name: Commit category image replacements
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f premium-store/assets/categories
          git diff --cached --quiet || (git commit -m "assets: replace restaurant category plates with provided images" && git push)
