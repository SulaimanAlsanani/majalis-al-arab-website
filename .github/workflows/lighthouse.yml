name: Lighthouse Performance Baseline
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '*.html'
      - 'assets/**'
      - 'scripts/lighthouse.mjs'
      - '.github/workflows/lighthouse.yml'
concurrency:
  group: lighthouse-main
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  lighthouse:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Lighthouse and Chromium
        run: |
          npm install --no-save lighthouse@12.8.2 chrome-launcher@1.2.0 playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Run baseline measurements
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/majalis-lighthouse-http.log 2>&1 &
          sleep 2
          node scripts/lighthouse.mjs
      - name: Attach Lighthouse HTML-independent JSON reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: majalis-lighthouse-results
          path: performance-reports/
          if-no-files-found: warn
