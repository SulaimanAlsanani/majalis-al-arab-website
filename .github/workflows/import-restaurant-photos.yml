          file premium-store/assets/categories/areeka-masoob.png | grep -Eq 'PNG image|JPEG image'
          curl --fail --location --silent --show-error --retry 3 --max-time 90 "https://media.canva.com/v2/image-resize/format:PNG/height:133/quality:100/uri:ifs%3A%2F%2FM%2Fbba5b4fc-fe23-4b8a-b53f-9cac1577e36d/watermark:F/width:200?csig=AAAAAAAAAAAAAAAAAAAAAAGF7jhsf_UD_QiHSLdaPzmWp8NxA1on03ALe8WmWW9f&exp=1795245897&osig=AAAAAAAAAAAAAAAAAAAAAA4jBG-8nrAO8VPnvM1AG4EHYK3o5QnMPtVX9kWgG49p&signer=media-rpc&token=AAIAAU0AJGJiYTViNGZjLWZlMjMtNGI4YS1iNTNmLTljYWMxNTc3ZTM2ZAAAAAABofz-dShDhEiUeUZLN8eyBUsZQvdc5XDyfZaGolCtt-i5MMiNeA&x-canva-quality=thumbnail" -o premium-store/assets/categories/grills.png
          file premium-store/assets/categories/grills.png | grep -Eq 'PNG image|JPEG image'
