          curl --fail --location --silent --show-error --retry 3 --max-time 90 "https://media.canva.com/v2/image-resize/format:PNG/height:200/quality:100/uri:ifs%3A%2F%2FM%2F366e1796-3162-4960-a066-1b97f29fe849/watermark:F/width:200?csig=AAAAAAAAAAAAAAAAAAAAACRb2x0ztFogs89sKYonGSmm4hQglv6rGFK4sWThYTiO&exp=1795247123&osig=AAAAAAAAAAAAAAAAAAAAAAQEieOd4WQTOLq0icM6fhFjFupihspX5zs1iIQZBbgI&signer=media-rpc&token=AAIAAU0AJDM2NmUxNzk2LTMxNjItNDk2MC1hMDY2LTFiOTdmMjlmZTg0OQAAAAABof0RKjiOicc-6PUIx7Zna_QwzC1BroizNaZ8IZzQ5dWIzTwKyA&x-canva-quality=thumbnail" -o premium-store/assets/categories/appetizers.png
          file premium-store/assets/categories/appetizers.png | grep -Eq 'PNG image|JPEG image'
          curl --fail --location --silent --show-error --retry 3 --max-time 90 "https://media.canva.com/v2/image-resize/format:PNG/height:200/quality:100/uri:ifs%3A%2F%2FM%2F8a85964b-8d5c-468e-a3f6-2d60d43da002/watermark:F/width:200?csig=AAAAAAAAAAAAAAAAAAAAADgHH8K0Wln79bVS2CCS1IN8Kp1V9nJkHWN5sqFTxUq4&exp=1795246851&osig=AAAAAAAAAAAAAAAAAAAAANN_-u7vAirnuep0CqkY26f_02b3i_TXRQDPm2h9NNDP&signer=media-rpc&token=AAIAAU0AJDhhODU5NjRiLThkNWMtNDY4ZS1hM2Y2LTJkNjBkNDNkYTAwMgAAAAABof0NA7gwEo5wGnnhJ78-pr4Cb5RhUoz_dNlPnjvypw-jrbqhtw&x-canva-quality=thumbnail" -o premium-store/assets/categories/family-meals.png
          file premium-store/assets/categories/family-meals.png | grep -Eq 'PNG image|JPEG image'
      - name: Commit image assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add premium-store/assets/categories
          git diff --cached --quiet || (git commit -m "assets: add real plated-food category photos" && git push)
