name: Import restaurant category photos
on:
  push:
    branches: [feature/restaurant-real-category-photos-20261121]
    paths: ['.github/workflows/import-restaurant-photos.yml']
permissions:
  contents: write
jobs:
  import-photos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Download approved restaurant images
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p premium-store/assets/categories
          curl --fail --location --silent --show-error --retry 3 --max-time 90 "https://media.canva.com/v2/image-resize/format:PNG/height:133/quality:100/uri:ifs%3A%2F%2FM%2F7b176181-5bcd-4287-b3c9-51e7ed7c628a/watermark:F/width:200?csig=AAAAAAAAAAAAAAAAAAAAAGgP8GmXnswRz1-Pi1kr16eLAkSNVcgX8HNx263xL1pZ&exp=1795246488&osig=AAAAAAAAAAAAAAAAAAAAADNDzD7YFX0XzzxxCM_PtBMOQxDj3KtBDhGliZTi41Qx&signer=media-rpc&token=AAIAAU0AJDdiMTc2MTgxLTViY2QtNDI4Ny1iM2M5LTUxZTdlZDdjNjI4YQAAAAABof0HecBhMuqLaI42HQEnaP2Faxb92Ds6uS5LBlmBxICalL5VCQ&x-canva-quality=thumbnail" -o premium-store/assets/categories/breakfast.png
